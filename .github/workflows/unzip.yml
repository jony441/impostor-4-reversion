name: Extract game ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          ZIP="${{ steps.zip.outputs.zip }}"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          # Si el ZIP contiene una única carpeta raíz,
          # mueve su contenido a la raíz del repositorio.
          shopt -s dotglob nullglob
          items=(extracted/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            ROOT="${items[0]}"
            cp -a "$ROOT"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract game files from ZIP"
          git push
